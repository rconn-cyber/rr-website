<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Events CMS – Rough Riders Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:      #0d1f3c;
  --navy-dark: #071429;
  --navy-mid:  #162d55;
  --gold:      #C9A84C;
  --gold-lt:   #e0c06a;
  --cream:     #f0e8d0;
  --burgundy:  #6B1A1A;
  --green:     #2d6a2d;
  --red:       #8b1a1a;
  --border:    rgba(201,168,76,0.2);
  --input-bg:  rgba(255,255,255,0.05);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Crimson Pro',Georgia,serif; background:#0a1628; color:var(--cream); min-height:100vh; }

/* ── LOGIN ──────────────────────────────────────────────────────────────── */
#loginScreen {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--navy-dark),#1a0a0a);
}
.login-box {
  background:rgba(13,31,60,0.9); border:1px solid var(--border);
  padding:2.5rem; width:100%; max-width:360px; border-radius:3px;
  text-align:center;
}
.login-title {
  font-family:'Cinzel',serif; font-size:1.1rem; letter-spacing:0.1em;
  color:var(--gold); margin-bottom:1.5rem;
}
.login-input {
  width:100%; padding:0.7rem 1rem; margin-bottom:1rem;
  background:var(--input-bg); border:1px solid var(--border);
  color:var(--cream); font-family:'Crimson Pro',serif; font-size:1rem;
  border-radius:2px; outline:none; transition:border-color 0.2s;
}
.login-input:focus { border-color:var(--gold); }
.login-btn {
  width:100%; padding:0.75rem; font-family:'Cinzel',serif;
  font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase;
  background:var(--gold); color:var(--navy-dark); border:none;
  cursor:pointer; font-weight:700; border-radius:2px; transition:all 0.2s;
}
.login-btn:hover { background:var(--gold-lt); }
.login-err { color:#e87070; font-size:0.85rem; margin-top:0.75rem; }

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
#adminApp { display:none; }
.admin-header {
  background:rgba(7,20,41,0.98); border-bottom:1px solid var(--border);
  padding:0.75rem 1.5rem;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.admin-title { font-family:'Cinzel',serif; font-size:0.9rem; color:var(--gold); letter-spacing:0.08em; }
.admin-actions { display:flex; gap:0.75rem; align-items:center; }
.btn {
  font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.1em;
  text-transform:uppercase; padding:0.5rem 1rem; border-radius:2px;
  cursor:pointer; transition:all 0.2s; border:none;
}
.btn-primary { background:var(--gold); color:var(--navy-dark); font-weight:700; }
.btn-primary:hover { background:var(--gold-lt); }
.btn-ghost { background:transparent; color:rgba(240,232,208,0.6); border:1px solid var(--border); }
.btn-ghost:hover { color:var(--cream); border-color:var(--gold); }
.btn-danger { background:var(--red); color:var(--cream); }
.btn-danger:hover { filter:brightness(1.2); }
.btn-success { background:var(--green); color:var(--cream); }

.admin-body { padding:1.5rem; max-width:1300px; margin:0 auto; }

/* ── STATS BAR ───────────────────────────────────────────────────────────── */
.stats-bar {
  display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;
}
.stat-pill {
  background:rgba(13,31,60,0.7); border:1px solid var(--border);
  padding:0.6rem 1.2rem; border-radius:2px;
  font-family:'Cinzel',serif; font-size:0.7rem; letter-spacing:0.08em;
  color:rgba(240,232,208,0.6);
}
.stat-pill strong { color:var(--gold); font-size:1rem; margin-right:0.3rem; }

/* ── TABLE ───────────────────────────────────────────────────────────────── */
.table-wrap {
  background:rgba(13,31,60,0.6); border:1px solid var(--border);
  border-radius:3px; overflow:hidden;
}
table { width:100%; border-collapse:collapse; }
thead th {
  font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--gold);
  padding:0.8rem 1rem; border-bottom:1px solid var(--border);
  text-align:left; background:rgba(7,20,41,0.8);
}
tbody tr {
  border-bottom:1px solid rgba(201,168,76,0.08);
  transition:background 0.15s;
}
tbody tr:hover { background:rgba(201,168,76,0.04); }
tbody tr.featured-row { background:rgba(201,168,76,0.06); }
td { padding:0.8rem 1rem; font-size:0.9rem; vertical-align:middle; }
.event-thumb {
  width:48px; height:36px; object-fit:cover; border-radius:2px;
  border:1px solid rgba(201,168,76,0.2);
}
.event-emoji-thumb {
  width:48px; height:36px; display:inline-flex; align-items:center; justify-content:center;
  font-size:1.3rem; background:rgba(22,45,85,0.5); border-radius:2px;
}
.badge {
  font-family:'Cinzel',serif; font-size:0.58rem; letter-spacing:0.1em;
  padding:0.2rem 0.5rem; border-radius:2px; display:inline-block;
}
.badge-cat  { background:rgba(201,168,76,0.15); color:var(--gold); border:1px solid rgba(201,168,76,0.3); }
.badge-pub  { background:rgba(45,106,45,0.2);   color:#6fba6f;    border:1px solid rgba(45,106,45,0.4); }
.badge-priv { background:rgba(107,26,26,0.2);   color:#e07070;    border:1px solid rgba(107,26,26,0.4); }
.badge-feat { background:rgba(201,168,76,0.25); color:var(--gold-lt); border:1px solid rgba(201,168,76,0.5); }
.row-actions { display:flex; gap:0.4rem; }
.icon-btn {
  padding:0.3rem 0.6rem; border-radius:2px; cursor:pointer;
  font-size:0.75rem; border:none; transition:all 0.2s;
}
.icon-btn-edit  { background:rgba(22,45,85,0.8); color:var(--gold); border:1px solid var(--border); }
.icon-btn-edit:hover { background:rgba(201,168,76,0.2); }
.icon-btn-del   { background:rgba(107,26,26,0.4); color:#e07070; border:1px solid rgba(107,26,26,0.4); }
.icon-btn-del:hover { background:rgba(107,26,26,0.7); }

/* ── FORM MODAL ──────────────────────────────────────────────────────────── */
.modal-overlay {
  display:none; position:fixed; inset:0; z-index:500;
  background:rgba(7,20,41,0.93); backdrop-filter:blur(4px);
  align-items:flex-start; justify-content:center;
  padding:2rem 1rem; overflow-y:auto;
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:linear-gradient(160deg,#0d1f3c,#071429);
  border:1px solid var(--border); border-radius:3px;
  width:100%; max-width:820px;
  animation:modalIn 0.2s ease;
}
@keyframes modalIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.modal-header {
  padding:1.25rem 1.5rem; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.modal-header-title {
  font-family:'Cinzel',serif; font-size:0.95rem; color:var(--gold);
  letter-spacing:0.08em;
}
.modal-body { padding:1.5rem; }

.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.form-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem; }
.form-full { grid-column:1/-1; }
.form-group { display:flex; flex-direction:column; gap:0.35rem; }
.form-label {
  font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.12em;
  text-transform:uppercase; color:rgba(240,232,208,0.5);
}
.form-input, .form-select, .form-textarea {
  padding:0.6rem 0.75rem;
  background:var(--input-bg); border:1px solid var(--border);
  color:var(--cream); font-family:'Crimson Pro',serif; font-size:0.95rem;
  border-radius:2px; outline:none; width:100%; transition:border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--gold); }
.form-select option { background:#0d1f3c; }
.form-textarea { resize:vertical; min-height:100px; }
.form-textarea-lg { min-height:160px; }
.form-hint { font-size:0.78rem; color:rgba(240,232,208,0.35); margin-top:0.2rem; }
.form-check-row { display:flex; gap:1.5rem; align-items:center; }
.form-check { display:flex; align-items:center; gap:0.5rem; cursor:pointer; }
.form-check input { accent-color:var(--gold); width:15px; height:15px; cursor:pointer; }
.form-check span { font-size:0.9rem; color:rgba(240,232,208,0.7); }
.modal-footer {
  padding:1rem 1.5rem; border-top:1px solid var(--border);
  display:flex; gap:0.75rem; justify-content:flex-end;
}

/* ── PHOTO UPLOAD ────────────────────────────────────────────────────────── */
.photo-upload-zone {
  border:2px dashed rgba(201,168,76,0.3); border-radius:3px;
  padding:1.5rem; text-align:center; cursor:pointer;
  transition:border-color 0.2s; margin-top:0.5rem;
}
.photo-upload-zone:hover { border-color:rgba(201,168,76,0.6); }
.photo-upload-zone input { display:none; }
.upload-label {
  font-size:0.85rem; color:rgba(240,232,208,0.5); cursor:pointer;
}
.photo-preview-grid {
  display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.75rem;
}
.photo-prev {
  position:relative; width:80px; height:60px; border-radius:2px; overflow:hidden;
  border:1px solid rgba(201,168,76,0.3);
}
.photo-prev img { width:100%; height:100%; object-fit:cover; }
.photo-prev-del {
  position:absolute; top:2px; right:2px;
  background:rgba(107,26,26,0.9); color:#e07070;
  border:none; cursor:pointer; font-size:0.65rem; padding:2px 4px;
  border-radius:2px;
}
.upload-progress {
  font-size:0.8rem; color:var(--gold); margin-top:0.5rem;
}

/* ── TOAST ───────────────────────────────────────────────────────────────── */
.toast {
  position:fixed; bottom:2rem; right:2rem; z-index:999;
  font-family:'Cinzel',serif; font-size:0.72rem; letter-spacing:0.08em;
  padding:0.75rem 1.25rem; border-radius:3px;
  background:rgba(13,31,60,0.95); border:1px solid var(--gold);
  color:var(--cream); transform:translateY(100px); opacity:0;
  transition:all 0.3s;
}
.toast.show { transform:translateY(0); opacity:1; }
.toast.err  { border-color:#e07070; }

/* ── EMPTY STATE ─────────────────────────────────────────────────────────── */
.empty-state {
  text-align:center; padding:4rem 2rem;
  color:rgba(240,232,208,0.35); font-style:italic;
}

@media(max-width:640px){
  .form-grid,.form-grid-3{grid-template-columns:1fr;}
  .form-full{grid-column:auto;}
  .admin-body{padding:1rem;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-title">Events CMS<br><span style="font-size:0.7rem;color:rgba(240,232,208,0.4);">Rough Riders Admin</span></div>
    <input type="password" id="loginPass" class="login-input" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <header class="admin-header">
    <div class="admin-title">⭐ Events CMS — Tampa Rough Riders</div>
    <div class="admin-actions">
      <a href="/events.html" target="_blank" class="btn btn-ghost">View Public Page ↗</a>
      <button class="btn btn-primary" onclick="openForm()">+ New Event</button>
      <button class="btn btn-ghost" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <div class="admin-body">
    <div class="stats-bar" id="statsBar"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Event</th>
            <th>Date</th>
            <th>Category</th>
            <th>Visibility</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="eventsTableBody">
          <tr><td colspan="6" class="empty-state">Loading events…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- EVENT FORM MODAL -->
<div class="modal-overlay" id="formModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-header-title" id="formTitle">New Event</div>
      <button class="btn btn-ghost" onclick="closeForm()">✕ Cancel</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="fId"/>

      <div class="form-grid" style="margin-bottom:1rem">
        <div class="form-group form-full">
          <label class="form-label">Event Title *</label>
          <input type="text" id="fTitle" class="form-input" placeholder="31st Annual Charity Fishing Tournament"/>
        </div>
      </div>

      <div class="form-grid-3" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Start Date</label>
          <input type="date" id="fDateStart" class="form-input"/>
        </div>
        <div class="form-group">
          <label class="form-label">End Date (optional)</label>
          <input type="date" id="fDateEnd" class="form-input"/>
        </div>
        <div class="form-group">
          <label class="form-label">Time</label>
          <input type="text" id="fTime" class="form-input" placeholder="7:00 AM – 5:00 PM"/>
        </div>
      </div>

      <div class="form-grid" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="fLocation" class="form-input" placeholder="Treasure Island, FL"/>
        </div>
        <div class="form-group">
          <label class="form-label">Google Maps URL</label>
          <input type="url" id="fLocationUrl" class="form-input" placeholder="https://maps.google.com/…"/>
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="fCategory" class="form-select">
            <option>General</option>
            <option>Fishing</option>
            <option>Clays</option>
            <option>Social</option>
            <option>Parade</option>
            <option>Museum</option>
            <option>Membership</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Emoji / Icon</label>
          <input type="text" id="fEmoji" class="form-input" placeholder="🎣"/>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:1rem">
        <label class="form-label">Short Description (shown on card)</label>
        <textarea id="fDesc" class="form-textarea" placeholder="1–2 sentence teaser shown on the events grid card…"></textarea>
      </div>

      <div class="form-group" style="margin-bottom:1rem">
        <label class="form-label">Full Detail Page Body (HTML allowed)</label>
        <textarea id="fBody" class="form-textarea form-textarea-lg" placeholder="Full event details. HTML is supported — use &lt;p&gt;, &lt;ul&gt;, &lt;strong&gt;, &lt;a href&gt; etc."></textarea>
        <div class="form-hint">This appears in the event detail popup. Leave blank to show just the short description.</div>
      </div>

      <div class="form-grid" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">RSVP / Registration URL</label>
          <input type="text" id="fRsvpUrl" class="form-input" placeholder="https://… or leave # for none"/>
        </div>
        <div class="form-group">
          <label class="form-label">Button Label</label>
          <input type="text" id="fRsvpLabel" class="form-input" placeholder="Register Now"/>
        </div>
      </div>

      <div class="form-check-row" style="margin-bottom:1.5rem">
        <label class="form-check">
          <input type="checkbox" id="fPublic" checked/>
          <span>Public (visible without login)</span>
        </label>
        <label class="form-check">
          <input type="checkbox" id="fFeatured"/>
          <span>Featured (shown at top, large card)</span>
        </label>
        <label class="form-check">
          <input type="checkbox" id="fActive" checked/>
          <span>Active</span>
        </label>
      </div>

      <!-- Photo Upload -->
      <div class="form-group">
        <label class="form-label">Photos</label>
        <div class="photo-upload-zone" onclick="document.getElementById('photoFileInput').click()">
          <input type="file" id="photoFileInput" multiple accept="image/*" onchange="handlePhotoSelect(event)"/>
          <div class="upload-label">Click to upload photos (JPG, PNG, WebP) — multiple OK</div>
        </div>
        <div class="upload-progress" id="uploadProgress"></div>
        <div class="photo-preview-grid" id="photoPreviews"></div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeForm()">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveEvent()">Save Event</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// Set this to wherever this admin file is hosted (same Netlify site as events.html)
const API_BASE = '/.netlify/functions/events-api';
const UPLOAD_API = '/.netlify/functions/upload-photo';

let adminPass = '';
let allEvents = [];
let editingId = null;
let pendingPhotoUrls = []; // URLs already uploaded
let pendingPhotoFiles = []; // files staged but not yet uploaded

// ── AUTH ──────────────────────────────────────────────────────────────────────
function doLogin() {
  const pass = document.getElementById('loginPass').value.trim();
  if (!pass) return;
  // Test auth by fetching events with admin flag
  fetch(`${API_BASE}?all=true`, {
    headers: { 'Authorization': `Bearer ${pass}` }
  }).then(r => {
    if (r.ok) {
      adminPass = pass;
      sessionStorage.setItem('eventsAdminPass', pass);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      r.json().then(data => { allEvents = data; renderTable(); renderStats(); });
    } else {
      document.getElementById('loginErr').textContent = 'Incorrect password.';
    }
  }).catch(() => {
    document.getElementById('loginErr').textContent = 'Connection error.';
  });
}

function doLogout() {
  adminPass = '';
  sessionStorage.removeItem('eventsAdminPass');
  location.reload();
}

// Auto-restore session
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('eventsAdminPass');
  if (saved) {
    document.getElementById('loginPass').value = saved;
    doLogin();
  }
});

// ── FETCH ─────────────────────────────────────────────────────────────────────
async function fetchEvents() {
  const r = await fetch(`${API_BASE}?all=true`, {
    headers: { 'Authorization': `Bearer ${adminPass}` }
  });
  allEvents = await r.json();
  renderTable();
  renderStats();
}

// ── DATE HELPERS ──────────────────────────────────────────────────────────────
function fmtDate(start, end) {
  if (!start) return 'By Appt';
  const s = new Date(start + 'T12:00:00');
  const opts = { month:'short', day:'numeric', year:'numeric' };
  if (end && end !== start) {
    const e = new Date(end + 'T12:00:00');
    return s.toLocaleDateString('en-US',{month:'short',day:'numeric'}) +
           ' – ' + e.toLocaleDateString('en-US', opts);
  }
  return s.toLocaleDateString('en-US', opts);
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const total    = allEvents.length;
  const active   = allEvents.filter(e=>e.is_active).length;
  const featured = allEvents.filter(e=>e.is_featured).length;
  const pub      = allEvents.filter(e=>e.is_public && e.is_active).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill"><strong>${total}</strong> Total Events</div>
    <div class="stat-pill"><strong>${active}</strong> Active</div>
    <div class="stat-pill"><strong>${pub}</strong> Public</div>
    <div class="stat-pill"><strong>${featured}</strong> Featured</div>`;
}

// ── TABLE ─────────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('eventsTableBody');
  if (!allEvents.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No events yet. Create your first one!</td></tr>';
    return;
  }
  const sorted = [...allEvents].sort((a,b) => {
    // Featured first, then by date
    if (a.is_featured && !b.is_featured) return -1;
    if (!a.is_featured && b.is_featured) return 1;
    if (!a.date_start) return 1;
    if (!b.date_start) return -1;
    return a.date_start.localeCompare(b.date_start);
  });
  tbody.innerHTML = sorted.map(ev => {
    const photos = Array.isArray(ev.photo_urls) ? ev.photo_urls : [];
    const thumb = photos.length
      ? `<img class="event-thumb" src="${photos[0]}" alt=""/>`
      : `<div class="event-emoji-thumb">${ev.emoji||'⭐'}</div>`;
    const visiBadge = ev.is_public
      ? `<span class="badge badge-pub">Public</span>`
      : `<span class="badge badge-priv">Members</span>`;
    const featBadge = ev.is_featured
      ? `<span class="badge badge-feat" style="margin-left:0.3rem">★ Featured</span>` : '';
    const inactBadge = !ev.is_active
      ? `<span class="badge" style="background:rgba(100,100,100,0.2);color:#888;border:1px solid #444;margin-left:0.3rem">Archived</span>` : '';
    return `
    <tr class="${ev.is_featured ? 'featured-row' : ''}">
      <td>${thumb}</td>
      <td>
        <strong style="font-family:'Cinzel',serif;font-size:0.85rem">${ev.title}</strong>
        <div style="font-size:0.78rem;color:rgba(240,232,208,0.45);margin-top:0.2rem">${(ev.description||'').slice(0,60)}${ev.description?.length>60?'…':''}</div>
      </td>
      <td style="white-space:nowrap;font-size:0.85rem">${fmtDate(ev.date_start,ev.date_end)}</td>
      <td><span class="badge badge-cat">${ev.category||'General'}</span></td>
      <td>${visiBadge}${featBadge}${inactBadge}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn icon-btn-edit" onclick="openForm('${ev.id}')">✏ Edit</button>
          <button class="icon-btn icon-btn-del" onclick="archiveEvent('${ev.id}','${ev.title.replace(/'/g,"\\'")}')">🗑 Archive</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── FORM ──────────────────────────────────────────────────────────────────────
function openForm(id) {
  editingId = id || null;
  pendingPhotoUrls = [];
  pendingPhotoFiles = [];
  document.getElementById('photoPreviews').innerHTML = '';
  document.getElementById('uploadProgress').textContent = '';
  document.getElementById('formTitle').textContent = id ? 'Edit Event' : 'New Event';

  if (id) {
    const ev = allEvents.find(e => e.id === id);
    if (!ev) return;
    document.getElementById('fId').value = ev.id;
    document.getElementById('fTitle').value = ev.title || '';
    document.getElementById('fDateStart').value = ev.date_start || '';
    document.getElementById('fDateEnd').value = ev.date_end || '';
    document.getElementById('fTime').value = ev.time_display || '';
    document.getElementById('fLocation').value = ev.location || '';
    document.getElementById('fLocationUrl').value = ev.location_url || '';
    document.getElementById('fCategory').value = ev.category || 'General';
    document.getElementById('fEmoji').value = ev.emoji || '';
    document.getElementById('fDesc').value = ev.description || '';
    document.getElementById('fBody').value = ev.body_html || '';
    document.getElementById('fRsvpUrl').value = ev.rsvp_url || '';
    document.getElementById('fRsvpLabel').value = ev.rsvp_label || '';
    document.getElementById('fPublic').checked = ev.is_public !== false;
    document.getElementById('fFeatured').checked = !!ev.is_featured;
    document.getElementById('fActive').checked = ev.is_active !== false;
    // Load existing photos into preview
    pendingPhotoUrls = Array.isArray(ev.photo_urls) ? [...ev.photo_urls] : [];
    renderPhotoPreviews();
  } else {
    // Defaults for new event
    document.getElementById('fId').value = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fDateStart').value = '';
    document.getElementById('fDateEnd').value = '';
    document.getElementById('fTime').value = '';
    document.getElementById('fLocation').value = '';
    document.getElementById('fLocationUrl').value = '';
    document.getElementById('fCategory').value = 'General';
    document.getElementById('fEmoji').value = '⭐';
    document.getElementById('fDesc').value = '';
    document.getElementById('fBody').value = '';
    document.getElementById('fRsvpUrl').value = '';
    document.getElementById('fRsvpLabel').value = 'View Details';
    document.getElementById('fPublic').checked = true;
    document.getElementById('fFeatured').checked = false;
    document.getElementById('fActive').checked = true;
  }

  document.getElementById('formModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeForm() {
  document.getElementById('formModal').classList.remove('open');
  document.body.style.overflow = '';
  editingId = null;
}

// ── PHOTO UPLOAD ──────────────────────────────────────────────────────────────
function handlePhotoSelect(e) {
  pendingPhotoFiles = [...pendingPhotoFiles, ...Array.from(e.target.files)];
  renderPhotoPreviews();
}

function renderPhotoPreviews() {
  const grid = document.getElementById('photoPreviews');
  // Existing URLs
  const urlPrevs = pendingPhotoUrls.map((url, i) => `
    <div class="photo-prev">
      <img src="${url}" alt=""/>
      <button class="photo-prev-del" onclick="removeExistingPhoto(${i})">✕</button>
    </div>`).join('');
  // Staged files
  const filePrevs = pendingPhotoFiles.map((file, i) => {
    const objUrl = URL.createObjectURL(file);
    return `<div class="photo-prev">
      <img src="${objUrl}" alt=""/>
      <button class="photo-prev-del" onclick="removeStagedPhoto(${i})">✕</button>
    </div>`;
  }).join('');
  grid.innerHTML = urlPrevs + filePrevs;
}

function removeExistingPhoto(i) {
  pendingPhotoUrls.splice(i, 1);
  renderPhotoPreviews();
}

function removeStagedPhoto(i) {
  pendingPhotoFiles.splice(i, 1);
  renderPhotoPreviews();
}

async function uploadStagedPhotos() {
  if (!pendingPhotoFiles.length) return pendingPhotoUrls;

  const prog = document.getElementById('uploadProgress');
  const uploaded = [...pendingPhotoUrls];

  for (let i = 0; i < pendingPhotoFiles.length; i++) {
    const file = pendingPhotoFiles[i];
    prog.textContent = `Uploading photo ${i+1} of ${pendingPhotoFiles.length}…`;

    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });

    const resp = await fetch(UPLOAD_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${adminPass}`
      },
      body: JSON.stringify({
        filename: file.name,
        contentType: file.type || 'image/jpeg',
        data: b64
      })
    });

    if (resp.ok) {
      const { url } = await resp.json();
      uploaded.push(url);
    } else {
      const err = await resp.text();
      throw new Error(`Photo upload failed: ${err}`);
    }
  }

  prog.textContent = '';
  return uploaded;
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
async function saveEvent() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { toast('Title is required', true); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  try {
    // Upload any staged photos first
    const finalPhotoUrls = await uploadStagedPhotos();

    const payload = {
      title,
      date_start:   document.getElementById('fDateStart').value  || null,
      date_end:     document.getElementById('fDateEnd').value    || null,
      time_display: document.getElementById('fTime').value.trim() || null,
      location:     document.getElementById('fLocation').value.trim() || null,
      location_url: document.getElementById('fLocationUrl').value.trim() || null,
      category:     document.getElementById('fCategory').value,
      emoji:        document.getElementById('fEmoji').value.trim() || '⭐',
      description:  document.getElementById('fDesc').value.trim()  || null,
      body_html:    document.getElementById('fBody').value.trim()  || null,
      rsvp_url:     document.getElementById('fRsvpUrl').value.trim() || null,
      rsvp_label:   document.getElementById('fRsvpLabel').value.trim() || 'View Details',
      is_public:    document.getElementById('fPublic').checked,
      is_featured:  document.getElementById('fFeatured').checked,
      is_active:    document.getElementById('fActive').checked,
      photo_urls:   finalPhotoUrls
    };

    const method = editingId ? 'PUT' : 'POST';
    const url    = editingId ? `${API_BASE}?id=${editingId}` : API_BASE;

    const r = await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${adminPass}`
      },
      body: JSON.stringify(payload)
    });

    if (!r.ok) throw new Error(`Save failed: ${r.status}`);

    closeForm();
    await fetchEvents();
    toast(editingId ? 'Event updated ✓' : 'Event created ✓');

  } catch (err) {
    toast(err.message, true);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Event';
  }
}

// ── ARCHIVE ───────────────────────────────────────────────────────────────────
async function archiveEvent(id, title) {
  if (!confirm(`Archive "${title}"?\n\nIt will be hidden from the public page but not permanently deleted.`)) return;
  const r = await fetch(`${API_BASE}?id=${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${adminPass}` }
  });
  if (r.ok) {
    await fetchEvents();
    toast('Event archived');
  } else {
    toast('Archive failed', true);
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => { el.className = 'toast'; }, 3000);
}
</script>
