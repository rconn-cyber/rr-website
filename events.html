<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Events – 1st U.S. Volunteer Cavalry | Tampa Rough Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:      #0d1f3c;
  --navy-mid:  #162d55;
  --gold:      #C9A84C;
  --gold-dark: #a07e2a;
  --gold-lt:   #e8c96a;
  --cream:     #f0e8d0;
  --parchment: #e8dfc0;
  --burgundy:  #6B1A1A;
  --bg:        #f7f8fa;
  --bg2:       #ffffff;
  --text:      #1a1a2e;
  --text-mid:  #4a4a6a;
  --border:    #dde0e8;
  --shadow:    rgba(13,31,60,0.10);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Crimson Pro', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--navy);
  border-bottom: 3px solid var(--gold);
  padding: 0.75rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
}
.header-brand { text-decoration: none; }
.header-logo-text {
  font-family: 'Cinzel', serif; font-size: 0.9rem; font-weight: 700;
  color: var(--gold); letter-spacing: 0.05em; line-height: 1.3;
}
.header-logo-text span {
  display: block; font-size: 0.65rem; font-weight: 400;
  color: rgba(240,232,208,0.6); letter-spacing: 0.15em; text-transform: uppercase;
}
.header-nav { display: flex; gap: 1.5rem; }
.header-nav a {
  font-family: 'Cinzel', serif; font-size: 0.68rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(240,232,208,0.7); text-decoration: none; transition: color 0.2s;
}
.header-nav a:hover, .header-nav a.active { color: var(--gold); }

/* ── HERO ─────────────────────────────────────────────────────────────────── */
.events-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #162d55 100%);
  padding: 3.5rem 2rem 3rem; text-align: center;
  border-bottom: 1px solid var(--border);
}
.hero-label {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 0.75rem;
}
.hero-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 700; color: #fff;
  text-shadow: 0 2px 20px rgba(201,168,76,0.3);
  margin-bottom: 0.5rem;
}
.hero-rule {
  width: 100px; height: 2px; margin: 1rem auto;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
}
.hero-subtitle {
  font-size: 1rem; color: rgba(240,232,208,0.75);
  max-width: 500px; margin: 0 auto; font-style: italic;
}

/* ── FILTER BAR ───────────────────────────────────────────────────────────── */
.filter-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0.9rem 2rem;
  display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
  box-shadow: 0 2px 8px var(--shadow);
}
.filter-btn {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.4rem 1rem; border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-mid);
  cursor: pointer; transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--gold); color: var(--navy); }
.filter-btn.active {
  background: var(--navy); color: var(--gold);
  border-color: var(--navy); font-weight: 600;
}

/* ── MAIN ─────────────────────────────────────────────────────────────────── */
.events-main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

/* ── LOADING ──────────────────────────────────────────────────────────────── */
.state-msg {
  text-align: center; padding: 4rem 2rem;
  color: var(--text-mid); font-style: italic; font-size: 1.05rem;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border); border-top-color: var(--gold);
  border-radius: 50%; animation: spin 0.9s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FEATURED ─────────────────────────────────────────────────────────────── */
.featured-section { margin-bottom: 2.5rem; }
.section-label {
  font-family: 'Cinzel', serif; font-size: 0.62rem;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold-dark); margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.75rem;
}
.section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.featured-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
  display: grid; grid-template-columns: 1.1fr 1fr;
  box-shadow: 0 4px 20px var(--shadow);
  transition: box-shadow 0.2s, transform 0.2s;
  cursor: pointer;
}
.featured-card:hover {
  box-shadow: 0 8px 32px rgba(13,31,60,0.15);
  transform: translateY(-2px);
}
.featured-photo {
  aspect-ratio: 4/3; overflow: hidden; background: var(--parchment);
  position: relative;
}
.featured-photo img { width:100%; height:100%; object-fit:cover; }
.featured-photo-empty {
  height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 5rem;
  background: linear-gradient(135deg, var(--cream), var(--parchment));
}
.featured-body {
  padding: 2.5rem; display: flex; flex-direction: column;
  justify-content: space-between; border-left: 4px solid var(--gold);
}
.featured-meta {
  font-family: 'Cinzel', serif; font-size: 0.68rem;
  letter-spacing: 0.12em; color: var(--gold-dark); margin-bottom: 0.6rem;
}
.featured-title {
  font-family: 'Cinzel', serif; font-size: clamp(1.2rem,2.5vw,1.6rem);
  font-weight: 700; color: var(--navy); line-height: 1.3; margin-bottom: 0.6rem;
}
.featured-location {
  font-size: 0.85rem; color: var(--text-mid); margin-bottom: 0.75rem;
}
.featured-desc {
  font-size: 1rem; color: var(--text-mid); line-height: 1.7; margin-bottom: 1.5rem; flex: 1;
}
.event-cta {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-family: 'Cinzel', serif; font-size: 0.7rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--navy); color: var(--gold);
  padding: 0.7rem 1.5rem; text-decoration: none; font-weight: 600;
  border-radius: 4px; width: fit-content; border: none; cursor: pointer;
  transition: all 0.2s;
}
.event-cta:hover { background: var(--navy-mid); box-shadow: 0 4px 16px var(--shadow); }

/* ── GRID ─────────────────────────────────────────────────────────────────── */
.events-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
}
.event-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden; cursor: pointer;
  box-shadow: 0 2px 10px var(--shadow);
  transition: box-shadow 0.2s, transform 0.2s;
  display: flex; flex-direction: column;
}
.event-card:hover {
  box-shadow: 0 6px 24px rgba(13,31,60,0.15);
  transform: translateY(-3px);
}
.card-photo {
  height: 170px; overflow: hidden; background: var(--parchment); position: relative;
}
.card-photo img { width:100%; height:100%; object-fit:cover; transition: transform 0.3s; }
.event-card:hover .card-photo img { transform: scale(1.04); }
.card-photo-empty {
  height:100%; display:flex; align-items:center; justify-content:center;
  font-size:3rem; background: linear-gradient(135deg, var(--cream), var(--parchment));
}
.card-cat-badge {
  position: absolute; top: 0.6rem; left: 0.6rem;
  font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.12em;
  text-transform: uppercase; background: var(--navy); color: var(--gold);
  padding: 0.2rem 0.6rem; border-radius: 3px;
}
.card-top-stripe {
  height: 3px; background: var(--gold);
}
.card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
.card-date {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.12em; color: var(--gold-dark); margin-bottom: 0.4rem;
}
.card-title {
  font-family: 'Cinzel', serif; font-size: 0.95rem; font-weight: 600;
  color: var(--navy); line-height: 1.4; margin-bottom: 0.4rem;
}
.card-location {
  font-size: 0.82rem; color: var(--text-mid); margin-bottom: 0.5rem;
}
.card-desc { font-size: 0.9rem; color: var(--text-mid); line-height: 1.6; flex: 1; margin-bottom: 1rem; }
.card-btn {
  display: flex; align-items: center; justify-content: center; gap: 0.35rem;
  font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--navy); text-decoration: none;
  border: 1px solid var(--navy); padding: 0.5rem 1rem; border-radius: 4px;
  transition: all 0.2s; width: 100%; background: transparent; cursor: pointer;
}
.card-btn:hover { background: var(--navy); color: var(--gold); }

/* ── MODAL ────────────────────────────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(7,20,41,0.6); backdrop-filter: blur(4px);
  align-items: flex-start; justify-content: center;
  padding: 2rem 1rem; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg2); border-radius: 8px;
  width: 100%; max-width: 760px; position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(13,31,60,0.3);
  animation: modalIn 0.25s ease;
}
@keyframes modalIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.modal-top-stripe { height: 4px; background: linear-gradient(to right, var(--navy), var(--gold)); }
.modal-close {
  position: absolute; top: 0.75rem; right: 0.75rem; z-index: 10;
  font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.1em;
  color: var(--text-mid); background: var(--bg); border: 1px solid var(--border);
  padding: 0.35rem 0.75rem; cursor: pointer; border-radius: 4px; transition: all 0.2s;
}
.modal-close:hover { background: var(--navy); color: var(--gold); border-color: var(--navy); }
.modal-photo-strip {
  height: 240px; overflow: hidden; background: var(--parchment); position: relative;
}
.modal-photo-strip img { width:100%; height:100%; object-fit:cover; }
.modal-photo-empty {
  height:100%; display:flex; align-items:center; justify-content:center;
  font-size:5rem; background: linear-gradient(135deg, var(--cream), var(--parchment));
}
.modal-photo-nav {
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:space-between; padding:0 1rem;
}
.photo-nav-btn {
  background: rgba(255,255,255,0.9); border: 1px solid var(--border);
  color: var(--navy); font-size: 1.2rem; width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; border-radius:50%; box-shadow: 0 2px 8px var(--shadow);
  transition: all 0.2s;
}
.photo-nav-btn:hover { background: var(--navy); color: var(--gold); }
.photo-counter {
  position:absolute; bottom:0.75rem; right:1rem;
  font-family:'Cinzel',serif; font-size:0.62rem;
  background: rgba(255,255,255,0.9); color: var(--text-mid);
  padding:0.2rem 0.6rem; border-radius:3px;
}
.modal-content { padding: 1.75rem 2rem 2rem; }
.modal-category {
  font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:0.15em;
  text-transform:uppercase; color: var(--gold-dark); margin-bottom:0.5rem;
}
.modal-title {
  font-family:'Cinzel',serif; font-size:clamp(1.3rem,3vw,1.8rem);
  font-weight:700; color: var(--navy); line-height:1.3; margin-bottom:1rem;
}
.modal-details {
  display:flex; gap:2rem; flex-wrap:wrap; margin-bottom:1.25rem;
  padding-bottom:1.25rem; border-bottom:1px solid var(--border);
}
.detail-item { display:flex; flex-direction:column; gap:0.2rem; }
.detail-label {
  font-family:'Cinzel',serif; font-size:0.58rem; letter-spacing:0.15em;
  text-transform:uppercase; color: var(--text-mid);
}
.detail-value { font-size:0.95rem; color: var(--text); }
.detail-value a { color: var(--navy); }
.modal-body { font-size:1rem; color:var(--text-mid); line-height:1.8; margin-bottom:1.5rem; }
.modal-body p { margin-bottom:0.75rem; }
.modal-cta-row { display:flex; gap:1rem; flex-wrap:wrap; }
.photo-thumbs {
  display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1.25rem;
  padding-top:1.25rem; border-top:1px solid var(--border);
}
.photo-thumb {
  width:68px; height:52px; border-radius:4px; overflow:hidden;
  cursor:pointer; border:2px solid transparent; transition:border-color 0.2s;
}
.photo-thumb.active { border-color: var(--gold); }
.photo-thumb img { width:100%; height:100%; object-fit:cover; }

/* ── NO EVENTS ────────────────────────────────────────────────────────────── */
.no-events {
  text-align:center; padding:4rem 2rem; color:var(--text-mid);
  font-style:italic; font-size:1.05rem; grid-column:1/-1;
}

/* ── FOOTER ───────────────────────────────────────────────────────────────── */
.events-footer {
  background: var(--navy); border-top: 3px solid var(--gold);
  padding: 2rem; text-align: center;
}
.footer-brand {
  font-family:'Cinzel',serif; font-size:0.8rem;
  letter-spacing:0.1em; color:var(--gold); margin-bottom:0.5rem;
}
.footer-sub { font-size:0.85rem; color:rgba(240,232,208,0.5); }
.footer-sub a { color:rgba(201,168,76,0.7); text-decoration:none; }
.footer-sub a:hover { color:var(--gold); }

@media(max-width:768px){
  .featured-card { grid-template-columns:1fr; }
  .featured-photo { aspect-ratio:16/7; }
  .header-nav { display:none; }
  .events-main { padding:1.5rem 1rem 4rem; }
}
</style>
</head>
<body>

<div id="site-header"></div>

<section class="events-hero">
  <div class="hero-label">Community &amp; Mission</div>
  <h1 class="hero-title">Upcoming Events</h1>
  <div class="hero-rule"></div>
  <p class="hero-subtitle">Public events open to all. Members log in at tamparoughriders.org for member-only events.</p>
</section>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-cat="all" onclick="filterEvents('all',this)">All Events</button>
</div>

<main class="events-main" id="eventsMain">
  <div class="state-msg" id="loadingMsg">
    <div class="spinner"></div>Loading events…
  </div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="eventModal" onclick="handleModalClick(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-top-stripe"></div>
    <button class="modal-close" onclick="closeModal()">✕ Close</button>
    <div class="modal-photo-strip" id="modalPhotoStrip">
      <div class="modal-photo-empty" id="modalPhotoEmpty"></div>
      <img id="modalPhotoImg" src="" alt="" style="display:none"/>
      <div class="modal-photo-nav" id="modalPhotoNav" style="display:none">
        <button class="photo-nav-btn" onclick="changePhoto(-1)">&#8249;</button>
        <button class="photo-nav-btn" onclick="changePhoto(1)">&#8250;</button>
      </div>
      <div class="photo-counter" id="photoCounter" style="display:none"></div>
    </div>
    <div class="modal-content">
      <div class="modal-category" id="modalCategory"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-details" id="modalDetails"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-cta-row" id="modalCta"></div>
      <div class="photo-thumbs" id="photoThumbs"></div>
    </div>
  </div>
</div>

<footer class="events-footer">
  <div class="footer-brand">1st U.S. Volunteer Cavalry Regiment – Rough Riders, Inc.</div>
  <div class="footer-sub">601 N. 19th St., Tampa, FL 33605 · <a href="https://tamparoughriders.org">tamparoughriders.org</a></div>
</footer>

<script>
// Fetch through Netlify function (uses service key, bypasses RLS)
const API = '/.netlify/functions/events-api';

let allEvents = [], activeFilter = 'all', modalEvent = null, photoIndex = 0;

async function loadEvents() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allEvents = await res.json();
    buildFilters();
    renderEvents();
  } catch(e) {
    document.getElementById('loadingMsg').innerHTML =
      '<p style="color:#888">Could not load events. Please try again later.</p>';
  }
}

function fmtDate(s, e) {
  if (!s) return 'By Appointment';
  const d = new Date(s + 'T12:00:00');
  const opts = {month:'long',day:'numeric',year:'numeric'};
  if (e && e !== s) {
    const d2 = new Date(e + 'T12:00:00');
    return d.toLocaleDateString('en-US',{month:'long',day:'numeric'}) +
           ' \u2013 ' + d2.toLocaleDateString('en-US',opts);
  }
  return d.toLocaleDateString('en-US', opts);
}
function fmtDateShort(s, e) {
  if (!s) return 'By Appointment';
  const d = new Date(s + 'T12:00:00');
  if (e && e !== s) {
    const d2 = new Date(e + 'T12:00:00');
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) +
           '\u2013' + d2.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function buildFilters() {
  const cats = [...new Set(allEvents.map(e=>e.category).filter(Boolean))];
  const bar = document.getElementById('filterBar');
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'filter-btn'; b.dataset.cat = cat; b.textContent = cat;
    b.onclick = () => filterEvents(cat, b);
    bar.appendChild(b);
  });
}

function filterEvents(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderEvents();
}

function renderEvents() {
  const main = document.getElementById('eventsMain');
  document.getElementById('loadingMsg')?.remove();
  const list = activeFilter === 'all' ? allEvents : allEvents.filter(e=>e.category===activeFilter);
  const featured = list.filter(e=>e.is_featured);
  const regular  = list.filter(e=>!e.is_featured);
  let html = '';
  if (featured.length) {
    html += '<div class="featured-section"><div class="section-label">Featured</div>';
    featured.forEach(ev => { html += featuredHTML(ev); });
    html += '</div>';
  }
  if (regular.length) {
    if (featured.length) html += '<div class="section-label" style="margin-bottom:1rem">All Events</div>';
    html += '<div class="events-grid">';
    regular.forEach(ev => { html += cardHTML(ev); });
    html += '</div>';
  }
  if (!list.length) html = '<div class="no-events">No events in this category right now.</div>';
  main.innerHTML = html;
}

function photoEl(ev, cls) {
  const photos = Array.isArray(ev.photo_urls) ? ev.photo_urls : [];
  if (photos.length) return `<img src="${photos[0]}" alt="${ev.title}" loading="lazy"/>`;
  return `<div class="${cls}">${ev.emoji||'⭐'}</div>`;
}

function featuredHTML(ev) {
  const photos = Array.isArray(ev.photo_urls) ? ev.photo_urls : [];
  return `<div class="featured-card" onclick="openModal('${ev.id}')">
    <div class="featured-photo">${photoEl(ev,'featured-photo-empty')}</div>
    <div class="featured-body">
      <div>
        <div class="featured-meta">${fmtDate(ev.date_start,ev.date_end)}${ev.time_display?' · '+ev.time_display:''}</div>
        <h3 class="featured-title">${ev.title}</h3>
        ${ev.location?`<div class="featured-location">&#128205; ${ev.location}</div>`:''}
        <p class="featured-desc">${ev.description||''}</p>
      </div>
      ${ev.rsvp_url&&ev.rsvp_url!=='#'
        ?`<a href="${ev.rsvp_url}" target="_blank" class="event-cta" onclick="event.stopPropagation()">${ev.emoji||''} ${ev.rsvp_label||'View Details'}</a>`
        :`<button class="event-cta" onclick="event.stopPropagation();openModal('${ev.id}')">View Details &rarr;</button>`}
    </div>
  </div>`;
}

function cardHTML(ev) {
  const photos = Array.isArray(ev.photo_urls) ? ev.photo_urls : [];
  return `<div class="event-card" onclick="openModal('${ev.id}')">
    <div class="card-photo">
      ${photos.length?`<img src="${photos[0]}" alt="${ev.title}" loading="lazy"/>`:`<div class="card-photo-empty">${ev.emoji||'⭐'}</div>`}
      ${ev.category?`<div class="card-cat-badge">${ev.category}</div>`:''}
    </div>
    <div class="card-top-stripe"></div>
    <div class="card-body">
      <div class="card-date">${fmtDateShort(ev.date_start,ev.date_end)}</div>
      <h3 class="card-title">${ev.title}</h3>
      ${ev.location?`<div class="card-location">&#128205; ${ev.location}</div>`:''}
      <p class="card-desc">${ev.description||''}</p>
      <button class="card-btn">${ev.rsvp_label||'View Details'} &rarr;</button>
    </div>
  </div>`;
}

function openModal(id) {
  modalEvent = allEvents.find(e=>e.id===id);
  if (!modalEvent) return;
  photoIndex = 0;
  populateModal(modalEvent);
  document.getElementById('eventModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('eventModal').classList.remove('open');
  document.body.style.overflow = '';
}
function handleModalClick(e) { if(e.target===document.getElementById('eventModal')) closeModal(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function populateModal(ev) {
  const photos = Array.isArray(ev.photo_urls) ? ev.photo_urls : [];
  const img = document.getElementById('modalPhotoImg');
  const empty = document.getElementById('modalPhotoEmpty');
  if (photos.length) {
    img.src = photos[0]; img.style.display='block'; empty.style.display='none';
    const nav = document.getElementById('modalPhotoNav');
    const ctr = document.getElementById('photoCounter');
    nav.style.display = photos.length>1?'flex':'none';
    ctr.style.display = photos.length>1?'block':'none';
    if (photos.length>1) ctr.textContent = `1 / ${photos.length}`;
  } else {
    img.style.display='none'; empty.style.display='flex'; empty.textContent=ev.emoji||'⭐';
    document.getElementById('modalPhotoNav').style.display='none';
    document.getElementById('photoCounter').style.display='none';
  }
  document.getElementById('photoThumbs').innerHTML = photos.length>1
    ? photos.map((u,i)=>`<div class="photo-thumb ${i===0?'active':''}" onclick="setPhoto(${i})"><img src="${u}" loading="lazy"/></div>`).join('') : '';
  document.getElementById('modalCategory').textContent = ev.category||'';
  document.getElementById('modalTitle').textContent = ev.title;
  let det='';
  if(ev.date_start) det+=`<div class="detail-item"><span class="detail-label">Date</span><span class="detail-value">${fmtDate(ev.date_start,ev.date_end)}</span></div>`;
  if(ev.time_display) det+=`<div class="detail-item"><span class="detail-label">Time</span><span class="detail-value">${ev.time_display}</span></div>`;
  if(ev.location) det+=`<div class="detail-item"><span class="detail-label">Location</span><span class="detail-value">${ev.location_url?`<a href="${ev.location_url}" target="_blank">${ev.location}</a>`:ev.location}</span></div>`;
  document.getElementById('modalDetails').innerHTML = det;
  document.getElementById('modalBody').innerHTML = ev.body_html||`<p>${ev.description||''}</p>`;
  document.getElementById('modalCta').innerHTML = (ev.rsvp_url&&ev.rsvp_url!=='#')
    ?`<a href="${ev.rsvp_url}" target="_blank" class="event-cta">${ev.emoji||''} ${ev.rsvp_label||'Register'}</a>`:'';
}
function setPhoto(i) {
  const photos = Array.isArray(modalEvent.photo_urls)?modalEvent.photo_urls:[];
  if(i<0||i>=photos.length) return;
  photoIndex=i;
  document.getElementById('modalPhotoImg').src=photos[i];
  document.getElementById('photoCounter').textContent=`${i+1} / ${photos.length}`;
  document.querySelectorAll('.photo-thumb').forEach((t,j)=>t.classList.toggle('active',j===i));
}
function changePhoto(d) {
  const photos = Array.isArray(modalEvent.photo_urls)?modalEvent.photo_urls:[];
  setPhoto((photoIndex+d+photos.length)%photos.length);
}

loadEvents();
</script>
<script src="header.js"></script>
</body>
