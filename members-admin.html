<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Members CMS – Rough Riders Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:     #0d1f3c;
  --navy-mid: #162d55;
  --gold:     #C9A84C;
  --gold-dk:  #a07e2a;
  --bg:       #f7f8fa;
  --bg2:      #ffffff;
  --text:     #1a1a2e;
  --text-mid: #4a4a6a;
  --border:   #dde0e8;
  --shadow:   rgba(13,31,60,0.10);
  --red:      #8b1a1a;
  --green:    #1a6b3a;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Crimson Pro',Georgia,serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* LOGIN */
#loginScreen {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--navy),var(--navy-mid));
}
.login-box {
  background:var(--bg2); border:1px solid var(--border); border-top:4px solid var(--gold);
  padding:2.5rem; width:100%; max-width:360px; border-radius:6px;
  text-align:center; box-shadow:0 8px 32px var(--shadow);
}
.login-logo { font-family:'Cinzel',serif; font-size:1.1rem; font-weight:700; color:var(--navy); margin-bottom:0.25rem; }
.login-sub  { font-size:0.8rem; color:var(--text-mid); margin-bottom:1.75rem; letter-spacing:0.05em; }
.login-input {
  width:100%; padding:0.7rem 1rem; margin-bottom:1rem;
  background:var(--bg); border:1px solid var(--border);
  color:var(--text); font-family:'Crimson Pro',serif; font-size:1rem;
  border-radius:4px; outline:none; transition:border-color 0.2s;
}
.login-input:focus { border-color:var(--gold); }
.login-btn {
  width:100%; padding:0.75rem; font-family:'Cinzel',serif;
  font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
  background:var(--navy); color:var(--gold); border:none;
  cursor:pointer; font-weight:700; border-radius:4px; transition:all 0.2s;
}
.login-btn:hover { background:var(--navy-mid); }
.login-err { color:#c0392b; font-size:0.85rem; margin-top:0.75rem; }

/* APP */
#adminApp { display:none; }
.admin-header {
  background:var(--navy); border-bottom:3px solid var(--gold);
  padding:0.75rem 1.5rem;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
  box-shadow:0 2px 12px var(--shadow);
}
.admin-title { font-family:'Cinzel',serif; font-size:0.88rem; color:var(--gold); letter-spacing:0.08em; }
.admin-actions { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }

/* BUTTONS */
.btn {
  font-family:'Cinzel',serif; font-size:0.62rem; letter-spacing:0.1em;
  text-transform:uppercase; padding:0.48rem 0.9rem; border-radius:4px;
  cursor:pointer; transition:all 0.2s; border:none; white-space:nowrap;
}
.btn-primary { background:var(--navy); color:var(--gold); font-weight:700; }
.btn-primary:hover { background:var(--navy-mid); }
.btn-ghost { background:transparent; color:rgba(240,232,208,0.7); border:1px solid rgba(201,168,76,0.4); }
.btn-ghost:hover { color:var(--gold); border-color:var(--gold); }
.btn-outline { background:var(--bg2); color:var(--text-mid); border:1px solid var(--border); }
.btn-outline:hover { border-color:var(--navy); color:var(--navy); }
.btn-danger { background:var(--red); color:#fff; }
.btn-danger:hover { filter:brightness(1.2); }
.btn-sm { padding:0.3rem 0.65rem; font-size:0.58rem; }

/* BODY */
.admin-body { padding:1.5rem; max-width:1400px; margin:0 auto; }

/* STATS */
.stats-bar { display:flex; gap:1rem; margin-bottom:1.25rem; flex-wrap:wrap; }
.stat-pill {
  background:var(--bg2); border:1px solid var(--border); border-left:3px solid var(--gold);
  padding:0.6rem 1.2rem; border-radius:4px;
  font-family:'Cinzel',serif; font-size:0.68rem; letter-spacing:0.06em;
  color:var(--text-mid); box-shadow:0 1px 4px var(--shadow);
}
.stat-pill strong { color:var(--navy); font-size:1.1rem; margin-right:0.3rem; }

/* TOOLBAR */
.toolbar {
  display:flex; gap:0.75rem; align-items:center; margin-bottom:1.25rem;
  flex-wrap:wrap; justify-content:space-between;
}
.toolbar-left  { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }
.toolbar-right { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }
.search-input {
  padding:0.45rem 0.9rem; border:1px solid var(--border); border-radius:4px;
  background:var(--bg2); color:var(--text); font-family:'Crimson Pro',serif;
  font-size:0.95rem; outline:none; width:220px; transition:border-color 0.2s;
}
.search-input:focus { border-color:var(--gold); }
.filter-select {
  padding:0.45rem 0.75rem; border:1px solid var(--border); border-radius:4px;
  background:var(--bg2); color:var(--text); font-family:'Crimson Pro',serif;
  font-size:0.9rem; outline:none; cursor:pointer;
}
.filter-select:focus { border-color:var(--gold); }

/* TABLE */
.table-wrap {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:6px; overflow:hidden;
  box-shadow:0 2px 12px var(--shadow);
}
table { width:100%; border-collapse:collapse; }
thead th {
  font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--text-mid);
  padding:0.8rem 1rem; border-bottom:2px solid var(--border);
  text-align:left; background:var(--bg); white-space:nowrap;
  cursor:pointer; user-select:none;
}
thead th:hover { color:var(--navy); }
thead th.sort-asc::after  { content:' ▲'; font-size:0.5rem; }
thead th.sort-desc::after { content:' ▼'; font-size:0.5rem; }
tbody tr { border-bottom:1px solid var(--border); transition:background 0.15s; }
tbody tr:hover { background:#f0f4ff; }
td { padding:0.65rem 1rem; font-size:0.88rem; vertical-align:middle; }
.member-photo {
  width:36px; height:36px; border-radius:50%; object-fit:cover;
  border:2px solid var(--border);
}
.member-initials {
  width:36px; height:36px; border-radius:50%;
  background:var(--navy); color:var(--gold);
  display:inline-flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-size:0.65rem; font-weight:700;
  border:2px solid var(--border);
}
.badge {
  font-family:'Cinzel',serif; font-size:0.52rem; letter-spacing:0.08em;
  padding:0.15rem 0.45rem; border-radius:3px; display:inline-block; white-space:nowrap;
}
.badge-active   { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }
.badge-inactive { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
.badge-loa      { background:#fffbeb; color:#92400e; border:1px solid #fde68a; }
.badge-emeritus { background:#f5f3ff; color:#5b21b6; border:1px solid #ddd6fe; }
.badge-honorary { background:#fdf4ff; color:#86198f; border:1px solid #f0abfc; }
.badge-owner    { background:#0d1f3c; color:#C9A84C; border:1px solid #C9A84C; }
.badge-events   { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
.badge-membership { background:#ecfdf5; color:#065f46; border:1px solid #6ee7b7; }
.row-actions { display:flex; gap:0.35rem; }
.icon-btn {
  padding:0.28rem 0.6rem; border-radius:3px; cursor:pointer;
  font-size:0.72rem; border:1px solid var(--border);
  background:var(--bg); color:var(--text-mid); transition:all 0.2s;
}
.icon-btn:hover { border-color:var(--navy); color:var(--navy); background:#eef2ff; }
.icon-btn-del:hover { border-color:var(--red); color:var(--red); background:#fef2f2; }

/* MODAL */
.modal-overlay {
  display:none; position:fixed; inset:0; z-index:500;
  background:rgba(13,31,60,0.5); backdrop-filter:blur(3px);
  align-items:flex-start; justify-content:center;
  padding:1.5rem 1rem; overflow-y:auto;
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:var(--bg2); border:1px solid var(--border);
  border-top:4px solid var(--gold);
  border-radius:6px; width:100%; max-width:860px;
  box-shadow:0 16px 48px rgba(13,31,60,0.2);
  animation:modalIn 0.2s ease;
}
@keyframes modalIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.modal-header {
  padding:1.1rem 1.5rem; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg);
}
.modal-header-title { font-family:'Cinzel',serif; font-size:0.9rem; color:var(--navy); letter-spacing:0.06em; }
.modal-body-inner { padding:1.5rem; }
.modal-footer {
  padding:1rem 1.5rem; border-top:1px solid var(--border);
  display:flex; gap:0.75rem; justify-content:flex-end; background:var(--bg);
}

/* FORM */
.form-grid   { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
.form-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem; margin-bottom:1rem; }
.form-grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:1rem; margin-bottom:1rem; }
.form-full   { grid-column:1/-1; }
.form-group  { display:flex; flex-direction:column; gap:0.3rem; }
.form-label  {
  font-family:'Cinzel',serif; font-size:0.58rem; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--text-mid);
}
.form-input,.form-select,.form-textarea {
  padding:0.55rem 0.75rem; background:var(--bg);
  border:1px solid var(--border); color:var(--text);
  font-family:'Crimson Pro',serif; font-size:0.95rem;
  border-radius:4px; outline:none; width:100%; transition:border-color 0.2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--gold); background:var(--bg2); }
.form-textarea { resize:vertical; min-height:80px; }

/* PHOTO */
.photo-section {
  display:flex; align-items:center; gap:1.25rem; margin-bottom:1rem;
  padding:1rem; background:var(--bg); border:1px solid var(--border); border-radius:4px;
}
.photo-preview-lg {
  width:72px; height:72px; border-radius:50%; object-fit:cover;
  border:3px solid var(--gold); flex-shrink:0;
}
.photo-initials-lg {
  width:72px; height:72px; border-radius:50%;
  background:var(--navy); color:var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-size:1.1rem; font-weight:700;
  border:3px solid var(--gold); flex-shrink:0;
}
.photo-upload-zone {
  flex:1; border:2px dashed var(--border); border-radius:4px;
  padding:0.75rem 1rem; text-align:center; cursor:pointer;
  transition:border-color 0.2s; background:var(--bg2);
}
.photo-upload-zone:hover { border-color:var(--gold); background:#fffbf0; }
.photo-upload-zone input { display:none; }

/* TOAST */
.toast {
  position:fixed; bottom:2rem; right:2rem; z-index:999;
  font-family:'Cinzel',serif; font-size:0.7rem; letter-spacing:0.08em;
  padding:0.75rem 1.25rem; border-radius:4px;
  background:var(--navy); border-left:4px solid var(--gold);
  color:#fff; transform:translateY(100px); opacity:0;
  transition:all 0.3s; box-shadow:0 4px 16px var(--shadow);
}
.toast.show { transform:translateY(0); opacity:1; }
.toast.err  { border-left-color:#e74c3c; background:#7f1d1d; }
.toast.ok   { border-left-color:#16a34a; }

.empty-state { text-align:center; padding:3rem 2rem; color:var(--text-mid); font-style:italic; }
.member-name { font-family:'Cinzel',serif; font-size:0.78rem; color:var(--navy); }
.member-num  { font-size:0.75rem; color:var(--text-mid); }

@media(max-width:640px){
  .form-grid,.form-grid-3,.form-grid-4 { grid-template-columns:1fr; }
  .form-full { grid-column:auto; }
  .admin-body { padding:1rem; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Tampa Rough Riders</div>
    <div class="login-sub">Members CMS &#8212; Admin Access</div>
    <input type="password" id="loginPass" class="login-input" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <header class="admin-header">
    <div class="admin-title">&#11088; Rough Riders &#8212; Members CMS</div>
    <div class="admin-actions">
      <button class="btn btn-outline" onclick="exportCSV()">&#8595; Export CSV</button>
      <button class="btn btn-primary" onclick="openForm()">+ New Member</button>
      <button class="btn btn-ghost" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <div class="admin-body">
    <div class="stats-bar" id="statsBar"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" class="search-input" id="searchInput" placeholder="Search name, number, email…" oninput="applyFilters()"/>
        <select class="filter-select" id="filterLevel" onchange="applyFilters()">
          <option value="">All Levels</option>
          <option>Full Member</option>
          <option>Non-Resident Member</option>
          <option>Honorary Member</option>
          <option>Emeritus</option>
          <option>Leave of Absence</option>
        </select>
        <select class="filter-select" id="filterStatus" onchange="applyFilters()">
          <option value="">All Statuses</option>
          <option>Active</option>
          <option>Inactive</option>
          <option>LOA</option>
        </select>
        <select class="filter-select" id="filterAdmin" onchange="applyFilters()">
          <option value="">All Roles</option>
          <option>Owner</option>
          <option>Events Manager</option>
          <option>Membership Manager</option>
          <option>None</option>
        </select>
      </div>
      <div class="toolbar-right">
        <span id="resultCount" style="font-size:0.82rem;color:var(--text-mid);font-family:'Cinzel',serif;letter-spacing:0.05em;"></span>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:52px"></th>
            <th onclick="sortBy('member_number')" id="th-member_number">No.</th>
            <th onclick="sortBy('last_name')" id="th-last_name">Name</th>
            <th onclick="sortBy('rank')" id="th-rank">Rank</th>
            <th onclick="sortBy('membership_level')" id="th-membership_level">Level</th>
            <th onclick="sortBy('status')" id="th-status">Status</th>
            <th onclick="sortBy('admin_type')" id="th-admin_type">Role</th>
            <th onclick="sortBy('email')" id="th-email">Email</th>
            <th onclick="sortBy('date_joined')" id="th-date_joined">Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="membersTableBody">
          <tr><td colspan="10" class="empty-state">Loading&#8230;</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MEMBER FORM MODAL -->
<div class="modal-overlay" id="formModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-header-title" id="formTitle">New Member</div>
      <button class="btn btn-outline btn-sm" onclick="closeForm()">&#10005; Cancel</button>
    </div>
    <div class="modal-body-inner">
      <input type="hidden" id="fId"/>

      <!-- Photo -->
      <div class="photo-section">
        <div id="photoPreviewWrap">
          <div class="photo-initials-lg" id="photoInitials">?</div>
        </div>
        <div class="photo-upload-zone" onclick="document.getElementById('photoFileInput').click()">
          <input type="file" id="photoFileInput" accept="image/*" onchange="handlePhotoSelect(event)"/>
          <div style="font-size:0.85rem;color:var(--text-mid)">&#128247; Click to upload member photo</div>
          <div style="font-size:0.75rem;color:#9ca3af;margin-top:0.25rem">JPG, PNG, WebP</div>
        </div>
        <div id="uploadProgress" style="font-size:0.8rem;color:var(--gold-dk);"></div>
      </div>

      <!-- Name & Identity -->
      <div class="form-grid-4" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Member No. *</label>
          <input type="text" id="fMemberNumber" class="form-input" placeholder="1234"/>
        </div>
        <div class="form-group">
          <label class="form-label">Rank</label>
          <input type="text" id="fRank" class="form-input" placeholder="LT COL"/>
        </div>
        <div class="form-group">
          <label class="form-label">First Name *</label>
          <input type="text" id="fFirstName" class="form-input" placeholder="Theodore"/>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name *</label>
          <input type="text" id="fLastName" class="form-input" placeholder="Roosevelt"/>
        </div>
      </div>

      <!-- Membership -->
      <div class="form-grid-3" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Membership Level</label>
          <select id="fLevel" class="form-select">
            <option>Full Member</option>
            <option>Non-Resident Member</option>
            <option>Honorary Member</option>
            <option>Emeritus</option>
            <option>Leave of Absence</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="fStatus" class="form-select">
            <option>Active</option>
            <option>Inactive</option>
            <option>LOA</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Admin Role</label>
          <select id="fAdminType" class="form-select">
            <option>None</option>
            <option>Owner</option>
            <option>Events Manager</option>
            <option>Membership Manager</option>
          </select>
        </div>
      </div>

      <!-- Contact -->
      <div class="form-grid" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="fEmail" class="form-input" placeholder="troosevelt@whitehouse.gov"/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="fPhone" class="form-input" placeholder="(813) 555-0100"/>
        </div>
      </div>

      <!-- Address -->
      <div class="form-group" style="margin-bottom:1rem">
        <label class="form-label">Address</label>
        <input type="text" id="fAddress" class="form-input" placeholder="1600 Pennsylvania Ave NW"/>
      </div>
      <div class="form-grid-3" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">City</label>
          <input type="text" id="fCity" class="form-input" placeholder="Tampa"/>
        </div>
        <div class="form-group">
          <label class="form-label">State</label>
          <input type="text" id="fState" class="form-input" placeholder="FL" maxlength="2"/>
        </div>
        <div class="form-group">
          <label class="form-label">ZIP</label>
          <input type="text" id="fZip" class="form-input" placeholder="33605" maxlength="10"/>
        </div>
      </div>

      <!-- Date joined -->
      <div class="form-grid" style="margin-bottom:1rem">
        <div class="form-group">
          <label class="form-label">Date Joined</label>
          <input type="date" id="fDateJoined" class="form-input"/>
        </div>
        <div class="form-group" style="opacity:0"></div>
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea id="fNotes" class="form-textarea" placeholder="Internal notes about this member…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeForm()">Cancel</button>
      <button class="btn btn-danger btn-sm" id="deleteBtn" onclick="deleteMember()" style="display:none;margin-right:auto">&#128465; Delete</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveMember()">Save Member</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE  = '/.netlify/functions/members-api';
const LOGIN_API = '/.netlify/functions/admin-login';
const UPLOAD_API = '/.netlify/functions/upload-photo';

let adminToken  = '';
let allMembers  = [];
let editingId   = null;
let pendingPhotoFile = null;
let sortCol     = 'last_name';
let sortDir     = 'asc';

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const pass = document.getElementById('loginPass').value.trim();
  if (!pass) return;
  document.getElementById('loginErr').textContent = '';
  try {
    const r = await fetch(LOGIN_API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ password:pass })
    });
    if (!r.ok) { document.getElementById('loginErr').textContent = 'Incorrect password.'; return; }
    const { token } = await r.json();
    adminToken = token;
    sessionStorage.setItem('membersAdminToken', token);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminApp').style.display = 'block';
    await fetchMembers();
  } catch { document.getElementById('loginErr').textContent = 'Connection error.'; }
}

function doLogout() {
  adminToken = '';
  sessionStorage.removeItem('membersAdminToken');
  location.reload();
}

window.addEventListener('DOMContentLoaded', () => {
  const t = sessionStorage.getItem('membersAdminToken');
  if (t) {
    adminToken = t;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminApp').style.display = 'block';
    fetchMembers();
  }
});

function authHeaders(extra) {
  return Object.assign({ 'Authorization':`Bearer ${adminToken}` }, extra || {});
}

// ── DATA ──────────────────────────────────────────────────────────────────────
async function fetchMembers() {
  try {
    const r = await fetch(API_BASE, { headers: authHeaders() });
    if (r.status === 401) { doLogout(); return; }
    allMembers = await r.json();
    applyFilters();
    renderStats();
  } catch { toast('Failed to load members', true); }
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const total    = allMembers.length;
  const active   = allMembers.filter(m => m.status === 'Active').length;
  const loa      = allMembers.filter(m => m.status === 'LOA').length;
  const inactive = allMembers.filter(m => m.status === 'Inactive').length;
  const admins   = allMembers.filter(m => m.admin_type && m.admin_type !== 'None').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill"><strong>${total}</strong>Total</div>
    <div class="stat-pill"><strong>${active}</strong>Active</div>
    <div class="stat-pill"><strong>${loa}</strong>LOA</div>
    <div class="stat-pill"><strong>${inactive}</strong>Inactive</div>
    <div class="stat-pill"><strong>${admins}</strong>Admin Roles</div>`;
}

// ── SORT ──────────────────────────────────────────────────────────────────────
function sortBy(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortCol = col; sortDir = 'asc'; }
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
  });
  const th = document.getElementById('th-' + col);
  if (th) th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
  applyFilters();
}

// ── FILTER + RENDER ───────────────────────────────────────────────────────────
function applyFilters() {
  const q      = document.getElementById('searchInput').value.trim().toLowerCase();
  const level  = document.getElementById('filterLevel').value;
  const status = document.getElementById('filterStatus').value;
  const admin  = document.getElementById('filterAdmin').value;

  let list = allMembers.filter(m => {
    if (level  && m.membership_level !== level)  return false;
    if (status && m.status !== status)            return false;
    if (admin  && m.admin_type !== admin)         return false;
    if (q) {
      const hay = [m.first_name, m.last_name, m.member_number, m.email, m.rank, m.city]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    const av = (a[sortCol] || '').toString().toLowerCase();
    const bv = (b[sortCol] || '').toString().toLowerCase();
    return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
  });

  document.getElementById('resultCount').textContent =
    `${list.length} of ${allMembers.length} members`;

  renderTable(list);
}

function statusBadge(s) {
  const map = { Active:'badge-active', Inactive:'badge-inactive', LOA:'badge-loa' };
  return `<span class="badge ${map[s]||'badge-inactive'}">${s||'—'}</span>`;
}

function adminBadge(a) {
  if (!a || a === 'None') return '';
  const map = { Owner:'badge-owner', 'Events Manager':'badge-events', 'Membership Manager':'badge-membership' };
  return `<span class="badge ${map[a]||''}">${a}</span>`;
}

function initials(m) {
  return ((m.first_name||'?')[0] + (m.last_name||'?')[0]).toUpperCase();
}

function renderTable(list) {
  const tbody = document.getElementById('membersTableBody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No members found.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(m => {
    const photo = m.photo_url
      ? `<img class="member-photo" src="${m.photo_url}" alt=""/>`
      : `<div class="member-initials">${initials(m)}</div>`;
    const name = `${m.rank ? m.rank + ' ' : ''}${m.first_name || ''} ${m.last_name || ''}`.trim();
    const joined = m.date_joined
      ? new Date(m.date_joined + 'T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'})
      : '—';
    return `<tr>
      <td>${photo}</td>
      <td class="member-num">${m.member_number || '—'}</td>
      <td><div class="member-name">${name}</div>${m.email?`<div class="member-num">${m.email}</div>`:''}</td>
      <td style="font-size:0.82rem">${m.rank||'—'}</td>
      <td style="font-size:0.82rem">${m.membership_level||'—'}</td>
      <td>${statusBadge(m.status)}</td>
      <td>${adminBadge(m.admin_type)}</td>
      <td style="font-size:0.82rem;color:var(--text-mid)">${m.email||'—'}</td>
      <td style="font-size:0.82rem;color:var(--text-mid);white-space:nowrap">${joined}</td>
      <td><div class="row-actions">
        <button class="icon-btn" onclick="openForm(${m.id})">&#9998; Edit</button>
      </div></td>
    </tr>`;
  }).join('');
}

// ── FORM ──────────────────────────────────────────────────────────────────────
function openForm(id) {
  editingId   = id || null;
  pendingPhotoFile = null;
  document.getElementById('uploadProgress').textContent = '';
  document.getElementById('formTitle').textContent = id ? 'Edit Member' : 'New Member';
  document.getElementById('deleteBtn').style.display = id ? 'inline-block' : 'none';

  if (id) {
    const m = allMembers.find(x => x.id === id);
    if (!m) return;
    document.getElementById('fId').value           = m.id;
    document.getElementById('fMemberNumber').value = m.member_number || '';
    document.getElementById('fRank').value         = m.rank || '';
    document.getElementById('fFirstName').value    = m.first_name || '';
    document.getElementById('fLastName').value     = m.last_name || '';
    document.getElementById('fLevel').value        = m.membership_level || 'Full Member';
    document.getElementById('fStatus').value       = m.status || 'Active';
    document.getElementById('fAdminType').value    = m.admin_type || 'None';
    document.getElementById('fEmail').value        = m.email || '';
    document.getElementById('fPhone').value        = m.phone || '';
    document.getElementById('fAddress').value      = m.address || '';
    document.getElementById('fCity').value         = m.city || '';
    document.getElementById('fState').value        = m.state || '';
    document.getElementById('fZip').value          = m.zip || '';
    document.getElementById('fDateJoined').value   = m.date_joined || '';
    document.getElementById('fNotes').value        = m.notes || '';
    updatePhotoPreview(m.photo_url, m);
  } else {
    ['fId','fMemberNumber','fRank','fFirstName','fLastName','fEmail','fPhone',
     'fAddress','fCity','fState','fZip','fDateJoined','fNotes'].forEach(fid =>
      document.getElementById(fid).value = '');
    document.getElementById('fLevel').value     = 'Full Member';
    document.getElementById('fStatus').value    = 'Active';
    document.getElementById('fAdminType').value = 'None';
    updatePhotoPreview(null, null);
  }
  document.getElementById('formModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeForm() {
  document.getElementById('formModal').classList.remove('open');
  document.body.style.overflow = '';
}

function updatePhotoPreview(url, member) {
  const wrap = document.getElementById('photoPreviewWrap');
  if (url) {
    wrap.innerHTML = `<img class="photo-preview-lg" src="${url}" alt=""/>`;
  } else {
    const ini = member ? initials(member) : '?';
    wrap.innerHTML = `<div class="photo-initials-lg">${ini}</div>`;
  }
}

function handlePhotoSelect(e) {
  pendingPhotoFile = e.target.files[0];
  if (!pendingPhotoFile) return;
  const obj = URL.createObjectURL(pendingPhotoFile);
  document.getElementById('photoPreviewWrap').innerHTML =
    `<img class="photo-preview-lg" src="${obj}" alt=""/>`;
}

async function uploadPhoto() {
  if (!pendingPhotoFile) return null;
  const prog = document.getElementById('uploadProgress');
  prog.textContent = 'Uploading photo…';
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(pendingPhotoFile);
  });
  const resp = await fetch(UPLOAD_API, {
    method:'POST',
    headers: authHeaders({'Content-Type':'application/json'}),
    body: JSON.stringify({ filename:pendingPhotoFile.name, contentType:pendingPhotoFile.type||'image/jpeg', data:b64 })
  });
  prog.textContent = '';
  if (resp.ok) { const { url } = await resp.json(); return url; }
  throw new Error('Photo upload failed');
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
async function saveMember() {
  const firstName = document.getElementById('fFirstName').value.trim();
  const lastName  = document.getElementById('fLastName').value.trim();
  const memberNum = document.getElementById('fMemberNumber').value.trim();
  if (!firstName || !lastName) { toast('First and last name are required', true); return; }
  if (!memberNum) { toast('Member number is required', true); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    let photoUrl = null;
    if (editingId) {
      const existing = allMembers.find(m => m.id === editingId);
      photoUrl = existing?.photo_url || null;
    }
    if (pendingPhotoFile) photoUrl = await uploadPhoto();

    const payload = {
      member_number:    memberNum,
      rank:             document.getElementById('fRank').value.trim() || null,
      first_name:       firstName,
      last_name:        lastName,
      membership_level: document.getElementById('fLevel').value,
      status:           document.getElementById('fStatus').value,
      admin_type:       document.getElementById('fAdminType').value,
      email:            document.getElementById('fEmail').value.trim() || null,
      phone:            document.getElementById('fPhone').value.trim() || null,
      address:          document.getElementById('fAddress').value.trim() || null,
      city:             document.getElementById('fCity').value.trim() || null,
      state:            document.getElementById('fState').value.trim() || null,
      zip:              document.getElementById('fZip').value.trim() || null,
      date_joined:      document.getElementById('fDateJoined').value || null,
      notes:            document.getElementById('fNotes').value.trim() || null,
      photo_url:        photoUrl
    };

    if (editingId) payload.id = editingId;

    const r = await fetch(API_BASE, {
      method: editingId ? 'PUT' : 'POST',
      headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify(payload)
    });
    if (r.status === 401) { doLogout(); return; }
    if (!r.ok) throw new Error(`Save failed: ${r.status}`);
    closeForm();
    await fetchMembers();
    toast(editingId ? 'Member updated ✓' : 'Member created ✓', 'ok');
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Save Member';
  }
}

async function deleteMember() {
  const m = allMembers.find(x => x.id === editingId);
  if (!m) return;
  if (!confirm(`Permanently delete ${m.first_name} ${m.last_name} (#${m.member_number})?\n\nThis cannot be undone.`)) return;
  const r = await fetch(API_BASE, {
    method:'DELETE',
    headers: authHeaders({'Content-Type':'application/json'}),
    body: JSON.stringify({ id: editingId })
  });
  if (r.status === 401) { doLogout(); return; }
  if (r.ok) { closeForm(); await fetchMembers(); toast('Member deleted', 'ok'); }
  else toast('Delete failed', true);
}

// ── EXPORT CSV ────────────────────────────────────────────────────────────────
function exportCSV() {
  const cols = ['member_number','rank','last_name','first_name','membership_level',
                'status','admin_type','email','phone','address','city','state','zip',
                'date_joined','notes'];
  const esc = v => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    return s.includes(',') || s.includes('"') || s.includes('\n')
      ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const rows = [cols.join(',')];
  allMembers.forEach(m => rows.push(cols.map(c => esc(m[c])).join(',')));
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `rr-members-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast(`Exported ${allMembers.length} members ✓`, 'ok');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type==='ok'?' ok':type===true?' err':'');
  setTimeout(() => { el.className = 'toast'; }, 3200);
}
</script>
