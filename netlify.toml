[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Increase timeout for long-running sync functions (26s = Pro plan max)
[functions."sync-wa-supabase"]
  timeout = 26

[functions."sync-members"]
  timeout = 26

[functions."sync-events"]
  timeout = 26

[functions."sync-scheduled"]
  schedule = "0 * * * *"

# Secrets scanner exclusions
# Supabase anon key + URL are safe in frontend (public-read only)
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "events.html,index-events-snippet.html,admin.html,events-admin.html"

[[redirects]]
  from = "/events-admin"
  to   = "/events-admin.html"
  status = 200

[[redirects]]
  from = "/events"
  to   = "/events.html"
  status = 200

